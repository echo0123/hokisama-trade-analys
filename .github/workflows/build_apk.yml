name: Build Hokisama Trade Analys APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer with Locked Cython & Setuptools
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools==69.5.1" "wheel==0.43.0"
          pip install "cython==0.29.36" buildozer==1.5.0

      - name: Build Android APK
        run: |
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HokisamaTradeAnalys-APK
          path: bin/*.apk
