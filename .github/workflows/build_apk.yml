name: Build Hokisama Trade Analys APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Auto-Start Android WebView App
        run: |
          mkdir -p app/src/main/java/com/echogaulcorp/hokisamatrade
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          rootProject.name = "HokisamaTradeAnalys"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.echogaulcorp.hokisamatrade'
              compileSdk 34
              defaultConfig {
                  applicationId "com.echogaulcorp.hokisamatrade"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">127.0.0.1</domain>
                  <domain includeSubdomains="true">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
              <queries>
                  <package android:name="com.termux" />
              </queries>
              <application
                  android:label="Hokisama Trade Analys"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/echogaulcorp/hokisamatrade/MainActivity.java
          package com.echogaulcorp.hokisamatrade;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private WebView webView;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);

                  String loadingHtml = "<html><body style='background:#060b14;color:#00e5ff;font-family:monospace;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;text-align:center;'>"
                          + "<h2>⚡ HOKISAMA TRADE ANALYS</h2>"
                          + "<p style='color:#00e676;'>Menyalakan Engine AI & TradingView...</p>"
                          + "</body></html>";
                  webView.loadDataWithBaseURL(null, loadingHtml, "text/html", "UTF-8", null);

                  triggerTermuxBackend();
                  waitForServerAndLoad();
              }

              private void triggerTermuxBackend() {
                  try {
                      Intent intent = new Intent();
                      intent.setClassName("com.termux", "com.termux.app.RunCommandService");
                      intent.setAction("com.termux.RUN_COMMAND");
                      intent.putExtra("com.termux.RUN_COMMAND_PATH", "/data/data/com.termux/files/home/start_silent.sh");
                      intent.putExtra("com.termux.RUN_COMMAND_BACKGROUND", true);
                      startService(intent);
                  } catch (Exception ignored) {}
              }

              private void waitForServerAndLoad() {
                  new Thread(() -> {
                      for (int i = 0; i < 20; i++) {
                          try {
                              HttpURLConnection conn = (HttpURLConnection) new URL("http://127.0.0.1:8080/status").openConnection();
                              conn.setConnectTimeout(500);
                              conn.setReadTimeout(500);
                              if (conn.getResponseCode() == 200) {
                                  handler.post(() -> webView.loadUrl("http://127.0.0.1:8080"));
                                  return;
                              }
                          } catch (Exception ignored) {}
                          try { Thread.sleep(600); } catch (InterruptedException ignored) {}
                      }
                      handler.post(() -> webView.loadUrl("http://127.0.0.1:8080"));
                  }).start();
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HokisamaTradeAnalys-APK-v2
          path: app/build/outputs/apk/debug/*.apk
