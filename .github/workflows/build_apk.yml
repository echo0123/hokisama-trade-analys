name: Build Hokisama Trade Analys APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment & Lock Cython
        run: |
          mkdir -p /github/home/.cache/pip
          git config --global --add safe.directory /__w/hokisama-trade-analys/hokisama-trade-analys
          pip install --upgrade "pip<24.1" "setuptools==69.5.1" "wheel==0.43.0" "cython==0.29.36"

      - name: Build Android APK
        run: yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HokisamaTradeAnalys-APK
          path: bin/*.apk
